name: Export APK artifact
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-apk.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch released APK
        run: curl -L --fail -o FieldScanner-v0.5-debug.apk https://github.com/TannerPhillps-ThreatHunter/FieldScanner-Releases/releases/download/v0.5/FieldScanner-v0.5-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FieldScanner-v0.5-debug-apk
          path: FieldScanner-v0.5-debug.apk
          if-no-files-found: error
          compression-level: 0
